# Public scanner config. Deliberately contains NO employer-specific terms —
# this file ships with the repo. The forbidden-token list is private and lives
# at ~/.config/re-denylist.toml (local) or a CI secret.
title = "refusal-engineering — public rules"

[extend]
useDefault = true

[[rules]]
id = "internal-tld"
description = "Internal hostname patterns (structural, reveals nothing)"
# .local is RFC 6762 mDNS and .int is a real public TLD — both appear in
# legitimate documentation and model output. Matching them fired on an answer
# about /etc/hosts. Kept: TLDs that only ever suggest a private network.
regex = '''(?i)\b[\w.-]+\.(corp|internal|intranet|lan)\b'''
tags = ["structural"]

[[rules]]
id = "windows-source-path"
description = "Absolute Windows source paths leak repo topology"
# \b anchors the drive letter to a word boundary, and {2,} requires a real path
# segment. Without both, this matched `r:\n` inside ordinary string literals —
# "answer:\n" is structurally identical to "C:\Users". A rule that fires on
# prose is not a control; it is noise that trains you to bypass the hook.
regex = '''\b[A-Za-z]:\\[A-Za-z0-9._-]{2,}'''
tags = ["structural"]

[[rules]]
id = "private-registry"
description = "Non-public package registry URLs"
regex = '''(?i)(artifactory|nexus|jfrog)[\w.-]*\.[\w.-]+/'''
tags = ["structural"]

# Vendored and generated trees. These are gitignored and can never reach a
# commit, but a filesystem scan walks them anyway — and findings you have to
# learn to ignore are how a scan stops being read at all.
[[allowlists]]
description = "vendored / generated directories"
condition = "OR"
paths = [
  '''(^|/)\.venv/''',
  '''(^|/)node_modules/''',
  '''(^|/)_generated/''',
  '''(^|/)__pycache__/''',
]
