# Blank issues stay enabled. The two templates cover what is most wanted, but a
# reader with a question that fits neither should not be turned away by a form.
blank_issues_enabled: true
contact_links:
  - name: Security report
    url: https://github.com/langej117/not-evidence/security/advisories/new
    about: Private vulnerability reporting. Not a public issue — and see SECURITY.md for what is in scope, because the attack payloads working is the measured result, not a vulnerability.
  - name: Why pull requests are not accepted
    url: https://github.com/langej117/not-evidence/blob/main/CONTRIBUTING.md
    about: Two structural reasons, neither a judgement about your contribution. Issues are the channel.
