name: site

# Builds the static mirror and publishes it to GitHub Pages.
#
# Deliberately gated on the repository being public: Pages is not available for
# private repos on a free account, and a workflow that fails on every push
# teaches people to ignore the red X.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }

      - name: Install build dependency
        run: pip install -r site/requirements.txt

      - name: Verify every page has its own metadata
        # Fails if any page would ship without a title, description or
        # canonical URL — the whole reason this mirror exists.
        run: python3 site/build.py --check --base-url "${{ vars.SITE_BASE_URL || 'https://langej117.github.io/not-evidence' }}"

      - name: Build
        run: python3 site/build.py --base-url "${{ vars.SITE_BASE_URL || 'https://langej117.github.io/not-evidence' }}"

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with: { path: site/_build }

  deploy:
    # Only publishes once the repository is public. Until then the build still
    # runs on every push, so the mirror cannot silently rot.
    if: github.event.repository.visibility == 'public'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
