name: leak-check
on: [push, pull_request]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history — the default shallow checkout scans almost nothing

      - name: Public rules (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Forbidden-token scan (private denylist from secret)
        run: |
          printf '%s' "${{ secrets.DENYLIST_TOML }}" > /tmp/denylist.toml
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar -xz -C /tmp gitleaks
          # --redact: CI logs are world-readable once public. Never echo a match.
          /tmp/gitleaks git . --config /tmp/denylist.toml --redact --no-banner --exit-code 1

      - name: Identity audit
        run: |
          # Allow-list, not deny-list: naming forbidden employer domains here
          # would commit them to a public repository.
          bad=$(git log --format='%ae%n%ce' | sort -u | grep -v '^langej117@gmail.com$' || true)
          if [ -n "$bad" ]; then
            echo "BLOCKED - unexpected commit identity present in history"
            exit 1
          fi
