name: leak-check
on: [push, pull_request]

env:
  GITLEAKS_VERSION: "8.24.2"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. The default shallow checkout scans almost nothing,
          # which is the failure mode where a leak scan silently passes.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          # Extract into RUNNER_TEMP rather than a system path — writability of
          # /usr/local/bin is not guaranteed across runner images.
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gitleaks" version

      - name: Public rules (full history)
        # --redact: CI logs are world-readable once this repo is public.
        # A log that echoes the matched token defeats the entire exercise.
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: Forbidden-token scan (full history)
        # The denylist arrives via env, never interpolated into the script body.
        # It contains regex metacharacters, backslashes and quotes; splicing it
        # into shell source would corrupt it and is an injection surface.
        env:
          DENYLIST_TOML: ${{ secrets.DENYLIST_TOML }}
        run: |
          if [ -z "$DENYLIST_TOML" ]; then
            echo "BLOCKED - DENYLIST_TOML secret is empty or unset."
            echo "This scan is not optional. Set the secret before pushing."
            exit 1
          fi
          printf '%s' "$DENYLIST_TOML" > "$RUNNER_TEMP/denylist.toml"

          # Mutation check. An empty or malformed config also reports "no leaks
          # found" — identical output, opposite meaning. Prove the rules are
          # live by confirming the scanner catches a known canary before
          # trusting a clean result on the real tree.
          mkdir -p "$RUNNER_TEMP/canary"
          printf 'CANARY-DENYLIST-SELFTEST-8f3a2c\n' > "$RUNNER_TEMP/canary/probe.txt"
          if gitleaks dir "$RUNNER_TEMP/canary" \
               --config "$RUNNER_TEMP/denylist.toml" --redact --no-banner --exit-code 1; then
            echo "BLOCKED - the denylist did not catch its own canary."
            echo "The config is empty, malformed, or failed to load. A clean"
            echo "scan from here would be meaningless, so the build stops."
            exit 1
          fi
          echo "Self-test passed - denylist rules are live."

          gitleaks git . --config "$RUNNER_TEMP/denylist.toml" --redact --no-banner --exit-code 1

      - name: Identity audit (full history)
        # Allow-list, not deny-list. Naming forbidden employer domains here
        # would commit those very tokens to the repository.
        run: |
          unexpected=$(git log --format='%ae%n%ce' | sort -u | grep -v '^langej117@gmail\.com$' || true)
          if [ -n "$unexpected" ]; then
            echo "BLOCKED - unexpected commit identity present in history"
            exit 1
          fi
          echo "All commits authored and committed under the expected identity."
