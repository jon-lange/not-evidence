name: tests

# The repository's central promise is that its claims were measured. Nothing
# was watching whether the measurements still run — this workflow is that.
#
# Deliberately a BARE runner: no venvs, no cached wheels, nothing but Python.
# The author's machine has a venv for every specimen, which is exactly why the
# suite passed locally while failing on a clean clone.
on:
  push:
  pull_request:
  workflow_dispatch:

# Actions are pinned to commit SHAs, not tags. A tag is mutable: `@v4` is a
# pointer its owner can move, so pinning to one means trusting that nobody
# repoints it — which is a reassuring signal rather than a control.
#
# There is deliberately no Dependabot config to keep those pins fresh. Its pull
# requests are authored by a bot, the identity audit in leak-check.yml is an
# allow-list of exactly one address, and every such PR would fail a security
# check for a reason nobody could fix. CONTRIBUTING.md refuses pull requests for
# that same reason. So updating these is a manual job, and it belongs with the
# quarterly adversarial read in METHOD.md rather than to a bot whose output this
# repository would have to ignore.
jobs:
  consistency:
    name: metadata agrees with itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The OKF bundle timestamps every concept from git history, so a
          # shallow checkout cannot reproduce it. Same reason leak-check needs
          # it, different consequence: there a shallow scan passes vacuously,
          # here the producer would emit a different bundle and blame the tree.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }

      - name: The checker's own rules must be live
        # Same reasoning as the denylist canary in leak-check.yml: a checker
        # that passed because it looked at nothing prints the same thing as one
        # that passed because the tree was clean. The mutation harness breaks
        # every rule on purpose and requires the checker to catch each one, so
        # a clean result below means something.
        run: python3 scripts/test_check_consistency.py

      - name: Metadata is consistent
        run: python3 scripts/check-consistency.py

      - name: The standalone tool's own mutation record
        # tools/mutcheck.py argues that a passing assertion is not evidence
        # until you have watched it fail. Shipping it without running its own
        # mutation record in CI would be the joke it exists to prevent. The
        # script refuses to run against a red suite and says why.
        run: python3 tools/mutation_record.py

      - name: The OKF bundle is conformant and current
        # Committed generated output drifts. This fails if okf/ no longer
        # matches what the producer emits, or if what it emits would not
        # satisfy the spec — the second matters more, because a bundle that is
        # byte-identical to its producer's output still proves nothing if the
        # producer emits something invalid.
        run: python3 scripts/emit-okf.py --check

      - name: Every page has its own metadata
        # site.yml runs this too, but only on main — so a change to build.py
        # reached main unverified. That is how the index came to be built
        # without being checked: the gap was in which surface ran the check,
        # not in the check.
        run: |
          pip install -q -r site/requirements.txt
          python3 site/build.py --check

  bare:
    name: bare clone, nothing installed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }

      - name: make test
        run: make test

      - name: make demo
        run: make demo

      - name: no demo may fail
        run: |
          if make demo | grep -q FAILED; then
            echo "a demonstration failed on a bare runner"; exit 1
          fi

  full:
    name: every dependency installed, nothing skipped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }

      - name: Install every specimen's requirements
        run: |
          for r in specimens/*/requirements.txt; do
            [ -s "$r" ] && pip install -q -r "$r" || true
          done

      - name: make test — and no test may be skipped
        # On the bare runner some tests cannot run and say so. Here everything
        # is installed, so a skip means a suite quietly stopped covering
        # something. That is the failure this repository is named after.
        run: |
          out=$(make test); echo "$out"
          echo "$out" | grep -q "SKIPPED" && { echo "tests skipped with all deps present"; exit 1; }
          echo "$out" | grep -q "all suites green, nothing skipped" || { echo "unexpected summary"; exit 1; }
